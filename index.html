<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo2.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- ═══════════════════════════════════════════════════════
         PRIMARY SEO
    ═══════════════════════════════════════════════════════ -->
    <title>Flai - Dronevideo og foto i Trekantsområdet - En ny verden</title>
    <meta name="description" content="Flai - Dronevideo og foto i Trekantsområdet. 100% tilfredshedsgaranti. Book nemt og hurtigt på vores hjemmeside. Vi dækker Kolding, Vejle, Fredericia, Haderslev, Middelfart, Hedensted, Vejen, Vojens, Børkop, Strib, Bogense, Juelsminde, Taulov, Nørre Åby." />
    <meta name="robots" content="index, follow" />
    <!-- Canonical injected immediately from window.location so Googlebot sees
         the correct canonical even before React hydrates. SEO.tsx keeps the
         dynamic update for client-side navigations. -->
    <script>
      (function () {
        var BASE = 'https://flai.dk';
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var head = document.head;

        // Inject canonical so Googlebot sees the correct URL before React hydrates.
        // SEO.tsx keeps this updated for client-side navigations.
        var canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = path === '/' ? BASE : BASE + path;
        head.appendChild(canonical);

        // Also set og:url so social crawlers agree
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (!ogUrl) {
          ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          head.appendChild(ogUrl);
        }
        ogUrl.setAttribute('content', path === '/' ? BASE : BASE + path);
      })();
    </script>
    <link rel="related" href="https://flai.dk/docs/information" />

    <!-- ═══════════════════════════════════════════════════════
         OPEN GRAPH (Facebook, LinkedIn, WhatsApp)
    ═══════════════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flai" />
    <!-- og:url is injected dynamically by SEO.tsx for each route -->
    <meta property="og:title" content="Flai - Dronevideo og foto i Trekantsområdet - En ny verden" />
    <meta property="og:description" content="Flai - Dronevideo og foto i Trekantsområdet. 100% tilfredshedsgaranti. Book nemt og hurtigt på vores hjemmeside. Vi dækker Kolding, Vejle, Fredericia, Haderslev, Middelfart, Hedensted, Vejen, Vojens, Børkop, Strib, Bogense, Juelsminde, Taulov, Nørre Åby." />
    <meta property="og:image" content="https://www.flai.dk/Logo.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="da_DK" />

    <!-- ═══════════════════════════════════════════════════════
         TWITTER / X CARD
    ═══════════════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flai - Dronevideo og foto i Trekantsområdet - En ny verden" />
    <meta name="twitter:description" content="Flai - Dronevideo og foto i Trekantsområdet. 100% tilfredshedsgaranti. Book nemt og hurtigt på vores hjemmeside. Vi dækker Kolding, Vejle, Fredericia, Haderslev, Middelfart, Hedensted, Vejen, Vojens, Børkop, Strib, Bogense, Juelsminde, Taulov, Nørre Åby." />

    <!-- Cloudinary preconnect — used sitewide, zero cost on non-homepage routes -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- No hero video/poster preloads here on purpose. This block used to preload
         the 'herovideo' MP4 + poster on every homepage visit, but the homepage
         plays the CMS carousel's project video, so those bytes (billed by
         Cloudinary) were never used. HeroVideoSection fetches the right ones. -->

    <!-- Preconnect to Supabase -->
    <link rel="preconnect" href="https://pbqeljimuerxatrtmgsn.supabase.co" crossorigin="anonymous" />

    <!-- Fonts: system-UI stack — zero network round-trip, zero layout shift -->
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- INSTANT DARK BACKGROUND — prevents white flash before React mounts -->

      html, body, #root { background-color: #171717; margin: 0; padding: 0; }
    </style>
  </head>
  <body>

    <!-- 🚀 SPEED FIX: Added 'defer' to prevent JavaScript from blocking page rendering -->
    <script type="module" defer src="/src/main.tsx"></script>
